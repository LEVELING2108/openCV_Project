<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .logo {
      font-size: 20px;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .status-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      background-color: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .footer {
      font-size: 10px;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🛡️</div>
    <div>
      <div class="title">ExamGuard AI</div>
      <div class="subtitle">Session Integrity Agent</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span>Agent Status:</span>
      <span class="badge" id="agent-status">Active</span>
    </div>
    <div class="status-row">
      <span>Focus Lock:</span>
      <span style="color: #38bdf8; font-weight: 500;">Enforced</span>
    </div>
    <div class="status-row">
      <span>Session:</span>
      <span id="session-display" style="color: #94a3b8; font-family: monospace;">Linked</span>
    </div>
  </div>

  <div class="footer">
    Disclosed & permitted telemetry active only during authorized examination sessions.
  </div>

  <script src="popup.js"></script>
</body>
</html>
