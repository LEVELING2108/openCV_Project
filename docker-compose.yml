services:
  mongodb:
    image: mongo:latest
    container_name: examguard_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: examguard
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: examguard_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/examguard
      JWT_SECRET: examguard_dev_secret_key_2026
      CV_SERVICE_URL: http://cv-service:8000
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb

  cv-service:
    build: ./cv-service
    container_name: examguard_cv_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      YOLO_MODEL: yolov8n.pt

volumes:
  mongo_data:
